name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build MyAir debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm install

      - name: Build web dashboard (dist/, packaged into Android assets)
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install required Android SDK packages
        # ubuntu-latest runners ship a preinstalled Android SDK (ANDROID_HOME) already,
        # so no third-party setup action is used here. We only need to make sure the
        # specific platform/build-tools this project targets (compileSdk/targetSdk 36,
        # see android/app/build.gradle.kts) and the command-line tools are present, and
        # accept the SDK licenses non-interactively.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myair-debug-apk
          path: android/${{ steps.apk.outputs.path }}
          if-no-files-found: error
